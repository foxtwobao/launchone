[package]
name = "launchone"
version = "0.2.4"
description = "TokenOne application setup assistant"
edition = "2021"
license = "MIT"

[lib]
name = "launchone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "launchone"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dependencies]
async-trait = "0.1"
tauri = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = { version = "0.22", features = ["serde"] }
json5 = "0.4"
json-five = "0.3.1"
thiserror = "2"
dirs = "5"
plist = "1"
tempfile = "3"
fs2 = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
axum = "0.8"
minisign-verify = "0.3"

[profile.release]
strip = true
lto = "thin"
opt-level = "s"
