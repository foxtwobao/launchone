name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, macos, windows]
        default: all
        required: true
      environment:
        description: Build environment
        type: choice
        options: [lab, production]
        default: lab
        required: true

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} (${{ inputs.environment }})
    environment: ${{ inputs.environment == 'production' && 'desktop-release' || 'lab' }}
    # Windows production signing uses Azure OIDC, just as Botone does.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'macos' && '[{"os":"macos-26","platform":"macos","command":"package:mac","targets":"aarch64-apple-darwin,x86_64-apple-darwin"}]' || inputs.platform == 'windows' && '[{"os":"windows-2022","platform":"windows","command":"package:windows","targets":"x86_64-pc-windows-msvc"}]' || '[{"os":"macos-26","platform":"macos","command":"package:mac","targets":"aarch64-apple-darwin,x86_64-apple-darwin"},{"os":"windows-2022","platform":"windows","command":"package:windows","targets":"x86_64-pc-windows-msvc"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      LAUNCHONE_SERVICE_URL: ${{ vars.LAUNCHONE_SERVICE_URL }}
      LAUNCHONE_UPDATE_PUBLIC_KEY: ${{ vars.LAUNCHONE_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Validate environment and updater signing key
        env:
          BUILD_ENVIRONMENT: ${{ inputs.environment }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { buildEnvironment } from './scripts/build-environment.mjs';
          buildEnvironment(process.env.BUILD_ENVIRONMENT);
          if (!process.env.TAURI_SIGNING_PRIVATE_KEY?.trim()) {
            throw new Error('Missing TAURI_SIGNING_PRIVATE_KEY in the selected GitHub Environment');
          }
          NODE
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.platform }}-${{ inputs.environment }}
      - run: npm ci
      - run: npm run test:updates

      - name: Set up Windows signing runtime
        if: matrix.platform == 'windows' && inputs.environment == 'production'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Windows Artifact Signing client
        if: matrix.platform == 'windows' && inputs.environment == 'production'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget install Microsoft.ArtifactSigning.Client -Version 1.0.151 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'launchone-signing') -ExcludeVersion -NonInteractive -Source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'Artifact Signing client installation failed' }
      - name: Log in to Azure for Windows signing
        if: matrix.platform == 'windows' && inputs.environment == 'production'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.DESKTOP_WIN_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DESKTOP_WIN_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Package Lab app
        if: inputs.environment == 'lab'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run ${{ matrix.command }} -- --environment lab
      - name: Package signed and notarized macOS app
        if: matrix.platform == 'macos' && inputs.environment == 'production'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 || secrets.DESKTOP_MAC_CSC_LINK }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD || secrets.DESKTOP_MAC_CSC_KEY_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPLE_API_ISSUER }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: npm run package:mac -- --environment production
      - name: Package signed Windows x64 app
        if: matrix.platform == 'windows' && inputs.environment == 'production'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DESKTOP_WIN_AZURE_CLIENT_ID: ${{ secrets.DESKTOP_WIN_AZURE_CLIENT_ID }}
          DESKTOP_WIN_AZURE_TENANT_ID: ${{ secrets.DESKTOP_WIN_AZURE_TENANT_ID }}
          DESKTOP_WIN_SIGNING_ENDPOINT: ${{ vars.DESKTOP_WIN_SIGNING_ENDPOINT }}
          DESKTOP_WIN_SIGNING_ACCOUNT: ${{ vars.DESKTOP_WIN_SIGNING_ACCOUNT }}
          DESKTOP_WIN_SIGNING_PROFILE: ${{ vars.DESKTOP_WIN_SIGNING_PROFILE }}
          DESKTOP_WIN_PUBLISHER: ${{ vars.DESKTOP_WIN_PUBLISHER }}
        run: npm run package:windows -- --environment production

      - name: Retain installers, updater signatures and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LaunchOne-${{ inputs.environment }}-${{ matrix.platform }}-${{ github.run_number }}
          path: output/${{ inputs.environment }}/${{ matrix.platform }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
