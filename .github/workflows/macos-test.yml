name: macOS test build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      LAUNCHONE_IDONE_ISSUER: ${{ vars.LAUNCHONE_IDONE_ISSUER }}
      LAUNCHONE_CLIENT_ID: ${{ vars.LAUNCHONE_CLIENT_ID }}
      LAUNCHONE_SERVICE_URL: ${{ vars.LAUNCHONE_SERVICE_URL }}
      LAUNCHONE_CODEX_BASE_URL: ${{ vars.LAUNCHONE_CODEX_BASE_URL }}
      LAUNCHONE_CODEX_MODEL: ${{ vars.LAUNCHONE_CODEX_MODEL }}
      LAUNCHONE_CLAUDE_BASE_URL: ${{ vars.LAUNCHONE_CLAUDE_BASE_URL }}
      LAUNCHONE_CLAUDE_MODEL: ${{ vars.LAUNCHONE_CLAUDE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run test:core
      - run: npm run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: LaunchOne-macOS-universal-test
          path: output/macos/
          if-no-files-found: error
          retention-days: 14
